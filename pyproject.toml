[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genetic-disorder-ml"
version = "0.1.0"
description = "Machine learning project for genetic disorder dataset classification."
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
